# Local PostgreSQL for development and tests.
#   docker compose -f deploy/docker-compose.yml up -d
# Creates two databases: `trading` (development) and `trading_test` (pytest).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
